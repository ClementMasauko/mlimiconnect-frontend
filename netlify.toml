[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://mlimiconnect.onrender.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'"

# Keep browser authentication same-origin. Netlify forwards API requests to the
# Django service while the browser continues to use the Netlify domain.
[[redirects]]
  from = "/api/*"
  to = "https://mlimiconnect.onrender.com/api/:splat"
  status = 200
  force = true

# React Router SPA fallback. Keep this rule after the API proxy.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Demo accounts deliberately remain disabled here. For a test deployment, add
# VITE_DEMO_LOGIN_ENABLED=true in Netlify's environment variables and redeploy.
