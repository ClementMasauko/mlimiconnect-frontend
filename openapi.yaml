components:
  schemas:
    AccountTypeEnum:
      enum:
      - individual
      - cooperative
      - company
      - ngo
      - government
      - institution
      type: string
      description: |-
        * `individual` - Individual
        * `cooperative` - Cooperative
        * `company` - Company
        * `ngo` - NGO
        * `government` - Government
        * `institution` - Institution
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `suspended` - Suspended
    BusinessSizeEnum:
      enum:
      - small
      - medium
      - large
      type: string
      description: |-
        * `small` - Small
        * `medium` - Medium
        * `large` - Large
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          maxLength: 180
        message:
          type: string
      required:
      - email
      - message
      - name
      - subject
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        participant:
          type: string
          readOnly: true
        last_message:
          type: string
          readOnly: true
        unread_count:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - last_message
      - participant
      - unread_count
      - updated_at
    Listing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 180
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        stock:
          type: integer
          readOnly: true
        unit:
          $ref: '#/components/schemas/UnitEnum'
        pack_size:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        minimum_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        harvest_date:
          type: string
          format: date
          nullable: true
        available_from:
          type: string
          format: date
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        listing_expires_at:
          type: string
          format: date-time
          nullable: true
        grade:
          type: string
          maxLength: 50
        variety:
          type: string
          maxLength: 100
        moisture_content:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        certification:
          type: string
          maxLength: 140
        is_organic:
          type: boolean
        storage_conditions:
          type: string
        delivery_radius_km:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        allow_partial_fulfilment:
          type: boolean
        wholesale_tiers:
          type: array
          items:
            $ref: '#/components/schemas/WholesalePriceTier'
        normalized_price:
          type: string
          readOnly: true
        seller_verified:
          type: string
          readOnly: true
        category:
          type: string
          maxLength: 80
        listing_type:
          $ref: '#/components/schemas/ListingTypeEnum'
        listingType:
          type: string
          readOnly: true
        condition:
          type: string
          maxLength: 40
        image:
          type: string
          format: uri
        farmer:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        rating:
          type: string
          readOnly: true
        reviewsCount:
          type: string
          readOnly: true
        tag:
          type: string
          readOnly: true
        organization:
          type: integer
          readOnly: true
          nullable: true
        shared_with_team:
          type: boolean
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        moderation_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - category
      - created_at
      - description
      - farmer
      - id
      - listingType
      - location
      - moderation_reason
      - name
      - normalized_price
      - organization
      - price
      - quantity
      - rating
      - reviewsCount
      - seller_verified
      - shared_with_team
      - stock
      - tag
    ListingTypeEnum:
      enum:
      - fixed-price
      - auction
      - both
      type: string
      description: |-
        * `fixed-price` - Fixed price
        * `auction` - Auction
        * `both` - Both
    Message:
